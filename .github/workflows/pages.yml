name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html preview.js _site/
          cat .site-source/exact-css-01.part \
              .site-source/exact-css-02.part \
              .site-source/exact-css-03.part \
              .site-source/exact-css-04.part \
              .site-source/exact-css-05.part \
              .site-source/exact-css-06.part \
              .site-source/exact-css-07.part > _site/preview.css
          touch _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
